name: Deploy web build to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois ; une nouvelle annule celle en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export web build (static, base path /full-azimut)
        run: npx expo export --platform web

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Build admin app (static, base path /full-azimut/admin, no backend — see admin/src/changelog.ts)
        run: npm run build
        working-directory: admin

      - name: Merge admin build into the main site's dist/admin/
        run: |
          mkdir -p dist/admin
          cp -r admin/dist/. dist/admin/

      # Pages ignore les dossiers "_..." si Jekyll tourne dessus ; sans effet ici (deploiement
      # par Action, pas par branche), mais inoffensif a garder au cas ou la source change.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
