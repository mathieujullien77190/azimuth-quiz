name: Deploy web build to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois ; une nouvelle annule celle en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Une publication ne part que si tous les tests passent, avec la couverture a 100 % exigee par
      # le `coverageThreshold` de package.json (jest echoue sinon).
      - name: Unit tests (with the coverage threshold)
        run: npx jest --ci --coverage

      - name: Export web build (static, base path /azimuth-quiz)
        run: npx expo export --platform web
        env:
          # Inlined at build time (see src/helpers/firebase.ts) — without these the exported
          # bundle ships `undefined` for every Firebase config value, and online multiplayer
          # fails at startup with "auth/invalid-api-key". Not secret in the security sense (they
          # ship in the client bundle either way, access is gated by Firestore rules), but still
          # sourced from repo secrets rather than committed, same as any other config value.
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Build admin app (static, base path /azimuth-quiz/admin — reads/writes Firestore after a Google sign-in)
        run: npm run build
        working-directory: admin
        env:
          # Same client-side Firebase config as the game (see admin/src/firebase.ts).
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}

      - name: Merge admin build into the main site's dist/admin/
        run: |
          mkdir -p dist/admin
          cp -r admin/dist/. dist/admin/

      - name: Build Storybook (static, hosted at /azimuth-quiz/storybook — its own build uses relative asset paths, no base config needed)
        run: npm run build-storybook
        working-directory: admin

      - name: Merge Storybook build into the main site's dist/storybook/
        run: |
          mkdir -p dist/storybook
          cp -r admin/storybook-static/. dist/storybook/

      # Pages ignore les dossiers "_..." si Jekyll tourne dessus ; sans effet ici (deploiement
      # par Action, pas par branche), mais inoffensif a garder au cas ou la source change.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
