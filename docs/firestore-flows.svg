<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1020" width="1300" height="1020" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Flux Firestore d'Azimuth Quiz</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2571a"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6b2f"/>
    </marker>
  </defs>
  <rect width="1300" height="1020" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2a37">Flux Firestore : une partie de bout en bout</text>

  <!-- Légende -->
  <g font-size="12.5" fill="#5b6b7c">
    <path d="M24 49 H64" stroke="#1f5fa8" stroke-width="2.4"/><text x="72" y="54" fill="#1f5fa8" font-weight="700">hôte</text>
    <path d="M122 49 H162" stroke="#c2571a" stroke-width="2.4"/><text x="170" y="54" fill="#c2571a" font-weight="700">joueurs 2 à 10</text>
    <path d="M290 49 H330" stroke="#5b6b7c" stroke-width="2.2"/><text x="338" y="54">trait plein = écriture</text>
    <path d="M490 49 H530" stroke="#5b6b7c" stroke-width="2.2" stroke-dasharray="6 4"/><text x="538" y="54">pointillés = lecture / abonnement temps réel</text>
    <text x="840" y="54">tout passe par src/firebase/room.ts et firestore.rules</text>
  </g>

  <!-- Acteurs -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="30" y="72" width="230" height="40" rx="10" fill="#e3eefb" stroke="#1f5fa8" stroke-width="2"/><text x="145" y="97" fill="#1f5fa8">Hôte (appareil 1)</text>
    <rect x="285" y="72" width="230" height="40" rx="10" fill="#fdeee3" stroke="#c2571a" stroke-width="2"/><text x="400" y="97" fill="#c2571a">Joueurs 2 à 10</text>
    <rect x="560" y="72" width="716" height="40" rx="10" fill="#eaf5ea" stroke="#4a8a4a" stroke-width="2"/><text x="918" y="97" fill="#1f2a37">Firestore : une barre par collection</text>
  </g>
  <path d="M145 112 V1000" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="4 5" opacity="0.45"/>
  <path d="M400 112 V1000" stroke="#c2571a" stroke-width="1" stroke-dasharray="4 5" opacity="0.45"/>

  <!-- Barres des collections -->
  <g font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f6b2f">
    <text x="610" y="130">rooms</text><text x="710" y="130">places</text><text x="810" y="130">meta</text>
    <text x="910" y="130">countries</text><text x="1010" y="130">journal</text><text x="1110" y="130">errors</text><text x="1210" y="130">errorQuota</text>
  </g>
  <g fill="#eaf5ea" stroke="#4a8a4a">
    <rect x="585" y="138" width="50" height="690" rx="8"/>
    <rect x="685" y="138" width="50" height="690" rx="8"/>
    <rect x="785" y="138" width="50" height="690" rx="8"/>
    <rect x="885" y="138" width="50" height="690" rx="8"/>
    <rect x="985" y="138" width="50" height="690" rx="8"/>
    <rect x="1085" y="138" width="50" height="690" rx="8"/>
    <rect x="1185" y="138" width="50" height="690" rx="8"/>
  </g>
  <!-- 1 Créer et rejoindre -->
  <text x="24" y="150" font-size="13" font-weight="700" fill="#1f2a37">1 · Créer et rejoindre</text>
  <g font-size="12" fill="#1f2a37">
    <path d="M145 178 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="172">createRoom : supprime ses anciennes rooms, setDoc {hostUid, settings}</text>
    <path d="M400 210 H585" stroke="#c2571a" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
    <text x="300" y="204">roomExists : getDoc (la room existe-t-elle ?)</text>
    <path d="M400 242 H585" stroke="#c2571a" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
    <text x="300" y="236">joinRoomPresence : players.{uid}.name · joinedAt</text>
    <path d="M145 274 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="268">présence + couleurs des joueurs (l'hôte seul écrit les couleurs)</text>
    <path d="M585 306 H145" stroke="#1f5fa8" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
    <path d="M585 312 H400" stroke="#c2571a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ap)"/>
    <text x="160" y="300">connect() : 3 abonnements → useRoomStore (joueurs · réglages · manche)</text>
  </g>

  <!-- 2 Lancer -->
  <text x="24" y="352" font-size="13" font-weight="700" fill="#1f2a37">2 · Lancer la partie (l'hôte tire seul)</text>
  <g font-size="12" fill="#1f2a37">
    <path d="M785 380 H145" stroke="#1f5fa8" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
    <path d="M735 386 H145" stroke="#1f5fa8" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
    <text x="160" y="374">lit meta/compassCounts puis places/{clé}</text>
    <text x="160" y="402">(une requête `or` par tranche de 30 numéros)</text>
    <path d="M145 428 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="422">startRoomGame : screen 'game', origin, places, roundIndex 0</text>
  </g>

  <!-- 3 Manche -->
  <text x="24" y="470" font-size="13" font-weight="700" fill="#1f2a37">3 · Une manche</text>
  <g font-size="12" fill="#1f2a37">
    <path d="M400 498 H585" stroke="#c2571a" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
    <path d="M145 504 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="492">submitRoomGuess : guesses.{uid} (chacun écrit la sienne)</text>
    <path d="M145 536 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="530">tous ont répondu → finishRoomRound : scores, totalScores, screen 'reveal'</text>
    <path d="M585 568 H145" stroke="#1f5fa8" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
    <path d="M585 574 H400" stroke="#c2571a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ap)"/>
    <text x="160" y="562">révélation chez tous (abonnement)</text>
    <path d="M145 606 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="600">nextRoomRound : roundIndex + 1, ou screen 'end' (les invités continuent avec leur bouton)</text>
    <path d="M400 638 H585" stroke="#c2571a" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
    <text x="300" y="632">sendReaction : champ reaction {uid, emoji, seq}</text>
  </g>

  <!-- 4 Présence et départs -->
  <text x="24" y="680" font-size="13" font-weight="700" fill="#1f2a37">4 · Présence et départs</text>
  <g font-size="12" fill="#1f2a37">
    <path d="M400 708 H585" stroke="#c2571a" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
    <path d="M145 714 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="702">heartbeat players.{uid}.lastSeen toutes les 30 s</text>
    <path d="M145 746 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="740">l'hôte retire un joueur silencieux (90 s) ou expulsé, et purge ses données</text>
    <path d="M400 778 H585" stroke="#c2571a" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
    <text x="300" y="772">un joueur quitte : retire sa propre entrée</text>
    <path d="M145 810 H585" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="804">restartRoom (rejouer) · deleteRoom (l'hôte quitte : la room disparaît)</text>
  </g>

  <!-- 5 Erreurs -->
  <text x="24" y="852" font-size="13" font-weight="700" fill="#1f2a37">5 · Erreurs de jeu</text>
  <g font-size="12" fill="#1f2a37">
    <path d="M400 876 H1085" stroke="#c2571a" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>
    <path d="M145 882 H1085" stroke="#1f5fa8" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
    <text x="160" y="870">reporting() → errors/{id} + compteurs errorQuota, dans le même lot</text>
  </g>

  <!-- Admin -->
  <rect x="800" y="900" width="470" height="100" rx="10" fill="#fff" stroke="#4a8a4a"/>
  <g font-size="12" fill="#1f2a37">
    <text x="814" y="920" font-weight="700">Admin (compte Google) : écrit puis journalise</text>
    <text x="814" y="940">1 · documents (places…) · 2 · compteurs meta/compassCounts</text>
    <text x="814" y="958">3 · meta/dataVersion + 1 · 4 · journal/{id}, écrit en dernier</text>
    <text x="814" y="978">lit places et meta ; ne relit que les documents du journal</text>
  </g>
  <g stroke="#2f6b2f" stroke-width="1.8" fill="none" marker-end="url(#ad)">
    <path d="M710 900 V832"/>
    <path d="M810 900 V832"/>
    <path d="M1010 900 V832"/>
  </g>

  <!-- Règles -->
  <rect x="30" y="900" width="740" height="104" rx="10" fill="#fdf0f0" stroke="#b04a4a"/>
  <g font-size="12" fill="#1f2a37">
    <text x="46" y="921" font-weight="700">firestore.rules : qui peut écrire quoi</text>
    <text x="46" y="940">• rooms create : tout appareil connecté (auth anonyme), à son nom (hostUid = soi), jamais écraser une room</text>
    <text x="46" y="958">• rooms update : l'hôte, tout · un joueur (compassPlayer) : seulement players.{son uid}, guesses.{son uid}, reaction</text>
    <text x="46" y="976">• rooms delete : l'hôte seul · places, meta, countries : lecture publique, écriture admin (compte Google de la liste)</text>
    <text x="46" y="994">• journal : admin seulement · errors et errorQuota : création par tout appareil, avec les compteurs du jour</text>
  </g>
</svg>
