<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Architecture d'Azimuth Quiz</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a37"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2a37">Architecture : qui appelle qui</text>
  <text x="24" y="54" font-size="12.5" fill="#5b6b7c">les flèches vont de l'appelant vers l'appelé · pas de serveur propre : l'appli et l'admin parlent directement à Firebase</text>

  <!-- Appli Expo -->
  <rect x="20" y="70" width="640" height="670" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="40" y="96" font-size="15" font-weight="700" fill="#1f2a37">Appli Expo (src/) : web, iOS, Android</text>

  <rect x="50" y="112" width="580" height="60" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="340" y="136" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">app/ : routes Expo Router</text>
  <text x="340" y="156" font-size="12.5" text-anchor="middle" fill="#5b6b7c">_layout (providers, Stack) · index · setup · online-game · settings : re-exports minces</text>

  <rect x="50" y="192" width="580" height="86" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="340" y="216" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">screens/ : la couche « smart »</text>
  <text x="340" y="236" font-size="12.5" text-anchor="middle" fill="#5b6b7c">Home · Settings · Setup · OnlineGame · End · RoomDeleted</text>
  <text x="340" y="256" font-size="12.5" text-anchor="middle" fill="#5b6b7c">container (routeur, stores, libellés) → vue dumb (rendu seul) + hook colocalisé</text>

  <rect x="50" y="298" width="580" height="70" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="340" y="322" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">components/ : la couche « dumb »</text>
  <text x="340" y="342" font-size="12.5" text-anchor="middle" fill="#5b6b7c">ui · providers · home · geo (Compass, Globe3D) · game · setup (+ useSetupRoom)</text>
  <text x="340" y="360" font-size="12.5" text-anchor="middle" fill="#5b6b7c">props, callbacks, thème et traductions ; une story Storybook chacun</text>

  <rect x="50" y="388" width="280" height="86" rx="10" fill="#fff7ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="190" y="412" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">hooks/</text>
  <text x="190" y="432" font-size="12.5" text-anchor="middle" fill="#5b6b7c">room.ts : session, présence,</text>
  <text x="190" y="450" font-size="12.5" text-anchor="middle" fill="#5b6b7c">réactions, purge · app.ts : debounce,</text>
  <text x="190" y="468" font-size="12.5" text-anchor="middle" fill="#5b6b7c">attente du chargement</text>

  <rect x="350" y="388" width="280" height="86" rx="10" fill="#fff7ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="490" y="412" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">store/ : un seul store Zustand</text>
  <text x="490" y="432" font-size="12.5" text-anchor="middle" fill="#5b6b7c">useRoomStore : joueurs, hôte,</text>
  <text x="490" y="450" font-size="12.5" text-anchor="middle" fill="#5b6b7c">réglages, manche, réactions,</text>
  <text x="490" y="468" font-size="12.5" text-anchor="middle" fill="#5b6b7c">connexion (3 abonnements Firestore)</text>

  <rect x="50" y="494" width="280" height="86" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="190" y="518" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">helpers/ : fonctions simples</text>
  <text x="190" y="538" font-size="12.5" text-anchor="middle" fill="#5b6b7c">geo · scoring · rounds · utils</text>
  <text x="190" y="556" font-size="12.5" text-anchor="middle" fill="#5b6b7c">platform · storage · errors</text>
  <text x="190" y="574" font-size="12.5" text-anchor="middle" fill="#5b6b7c">sans Firebase</text>

  <rect x="350" y="494" width="280" height="86" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="490" y="518" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">settings · themes · i18n · data</text>
  <text x="490" y="538" font-size="12.5" text-anchor="middle" fill="#5b6b7c">réglages et nom du joueur</text>
  <text x="490" y="556" font-size="12.5" text-anchor="middle" fill="#5b6b7c">thèmes night / day · fr / en</text>
  <text x="490" y="574" font-size="12.5" text-anchor="middle" fill="#5b6b7c">constantes, score, catégories</text>

  <rect x="50" y="600" width="580" height="116" rx="10" fill="#eaf5ea" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="340" y="624" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a37">firebase/ : tout ce qui touche Firebase</text>
  <text x="340" y="644" font-size="12.5" text-anchor="middle" fill="#5b6b7c">client (app, db, auth) · room (créer, rejoindre, manche, présence, réactions)</text>
  <text x="340" y="662" font-size="12.5" text-anchor="middle" fill="#5b6b7c">places + groupedDraw + groupCounts (tirage) · errorSink · roomCode</text>
  <text x="340" y="680" font-size="12.5" text-anchor="middle" fill="#5b6b7c">constants · types · read · numbering · journal (purs, partagés avec l'admin)</text>
  <text x="340" y="700" font-size="12.5" text-anchor="middle" fill="#b04a4a">hors de tout barrel : importer le fichier directement</text>

  <g stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M340 172 V192"/>
    <path d="M340 278 V298"/>
    <path d="M190 368 V388"/>
    <path d="M490 368 V388"/>
    <path d="M190 474 V494"/>
    <path d="M490 474 V494"/>
    <path d="M190 580 V600"/>
    <path d="M490 580 V600"/>
    <path d="M330 431 H350"/>
  </g>

  <!-- Admin -->
  <rect x="700" y="70" width="480" height="228" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="720" y="96" font-size="15" font-weight="700" fill="#1f2a37">Admin (admin/, React + Vite) : connexion Google obligatoire</text>
  <rect x="730" y="112" width="420" height="56" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="940" y="136" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">views/ : une page par onglet</text>
  <text x="940" y="156" font-size="12.5" text-anchor="middle" fill="#5b6b7c">Lieux · Monde (three.js) · Erreurs</text>
  <rect x="730" y="180" width="420" height="56" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="940" y="204" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">api/ + data.ts + firebase.ts</text>
  <text x="940" y="224" font-size="12.5" text-anchor="middle" fill="#5b6b7c">écritures + journal, copie locale (IndexedDB)</text>
  <text x="940" y="266" font-size="12" text-anchor="middle" fill="#5b6b7c">réutilise src/firebase (types, lecture, numérotation, journal)</text>
  <text x="940" y="284" font-size="12" text-anchor="middle" fill="#5b6b7c">et les composants de src/ dans Storybook</text>

  <!-- Firebase -->
  <rect x="700" y="338" width="480" height="196" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="720" y="364" font-size="15" font-weight="700" fill="#1f2a37">Firebase (pas de serveur propre)</text>
  <rect x="730" y="382" width="200" height="132" rx="10" fill="#fdf0f0" stroke="#b04a4a" stroke-width="1.5"/>
  <text x="830" y="410" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">Auth</text>
  <text x="830" y="432" font-size="12" text-anchor="middle" fill="#5b6b7c">anonyme : les joueurs</text>
  <text x="830" y="450" font-size="12" text-anchor="middle" fill="#5b6b7c">Google : les admins</text>
  <text x="830" y="476" font-size="12" text-anchor="middle" fill="#5b6b7c">un uid par appareil,</text>
  <text x="830" y="494" font-size="12" text-anchor="middle" fill="#5b6b7c">hostUid dans la room</text>
  <rect x="950" y="382" width="200" height="132" rx="10" fill="#eaf5ea" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="1050" y="410" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">Firestore</text>
  <text x="1050" y="432" font-size="12" text-anchor="middle" fill="#5b6b7c">rooms · places · meta</text>
  <text x="1050" y="450" font-size="12" text-anchor="middle" fill="#5b6b7c">journal · errors</text>
  <text x="1050" y="476" font-size="12" text-anchor="middle" fill="#5b6b7c">firestore.rules (barrière)</text>
  <text x="1050" y="494" font-size="12" text-anchor="middle" fill="#5b6b7c">firestore.indexes.json</text>

  <!-- Build -->
  <rect x="700" y="574" width="480" height="166" rx="14" fill="#fff7ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="720" y="600" font-size="15" font-weight="700" fill="#1f2a37">Build et déploiement</text>
  <text x="720" y="626" font-size="12.5" fill="#5b6b7c">push sur master → GitHub Actions (deploy-pages.yml) :</text>
  <text x="720" y="646" font-size="12.5" fill="#5b6b7c">export web du jeu + build de l'admin + Storybook → GitHub Pages</text>
  <text x="720" y="674" font-size="12.5" fill="#5b6b7c">EAS : builds Android / iOS (variables EXPO_PUBLIC_FIREBASE_*)</text>
  <text x="720" y="702" font-size="12.5" fill="#b04a4a">règles et index Firestore : déployés à part</text>
  <text x="720" y="720" font-size="12.5" fill="#b04a4a">(npx firebase-tools deploy), jamais par le push</text>

  <!-- Flèches -->
  <g stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M630 658 H680 V470 H730"/>
    <path d="M940 298 V338" />
    <path d="M630 658 H680 V450 H950" stroke-dasharray="1 0"/>
  </g>
  <g font-size="11.5" fill="#1f2a37">
    <text x="636" y="650">SDK Firebase</text>
    <text x="950" y="324">lecture / écriture</text>
  </g>
</svg>
