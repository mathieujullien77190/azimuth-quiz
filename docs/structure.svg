<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1284" width="1400" height="1284" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Structure des fichiers d'Azimuth Quiz</title>
  <rect width="1400" height="1284" fill="#ffffff"/>
  <text x="24" y="40" font-size="19" font-weight="700" fill="#1f2a37">Structure des fichiers</text>
  <text x="254" y="40" font-size="13" fill="#5b6b7c">à quoi sert chaque dossier</text>
<rect x="24" y="70" width="1352" height="34" rx="6" fill="#1f4e79"/><text x="38" y="92" font-size="15" font-weight="700" fill="#ffffff">src/ : l’appli Expo (web, iOS, Android)</text><text x="534" y="92" font-size="12.5" fill="#ffffff" opacity="0.85">rôle</text><rect x="24" y="104" width="1352" height="30" fill="#ffffff"/><path d="M520 104 V134" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="124" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">app/</text><text x="534" y="124" font-size="13" fill="#3b4a5a">Routes Expo Router : _layout (providers + Stack), index, setup, online-game, settings. Re-exports minces.</text><rect x="24" y="134" width="1352" height="30" fill="#e8f0f8"/><path d="M520 134 V164" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="154" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">screens/</text><text x="534" y="154" font-size="13" fill="#3b4a5a">Un dossier par écran : container (routeur, stores, libellés) + vue dumb + styles + doc/.</text><rect x="24" y="164" width="1352" height="30" fill="#ffffff"/><path d="M520 164 V194" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="184" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">HomeScreen · SettingsScreen · RoomDeletedScreen · EndScreen</text><text x="534" y="184" font-size="13" fill="#3b4a5a">Container + vue ; l’état reste dans le container.</text><rect x="24" y="194" width="1352" height="30" fill="#e8f0f8"/><path d="M520 194 V224" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="214" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">SetupScreen · OnlineGameScreen</text><text x="534" y="214" font-size="13" fill="#3b4a5a">Container + vue + hook colocalisé (useOnlineRoom, useOnlineGame).</text><rect x="24" y="224" width="1352" height="30" fill="#ffffff"/><path d="M520 224 V254" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="244" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">components/</text><text x="534" y="244" font-size="13" fill="#3b4a5a">Composants réutilisables, rangés par rôle.</text><rect x="24" y="254" width="1352" height="30" fill="#e8f0f8"/><path d="M520 254 V284" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="274" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">ui/</text><text x="534" y="274" font-size="13" fill="#3b4a5a">Primitives : Button, Card, Chip, Screen, Section, SliderTrack, Toggle…</text><rect x="24" y="284" width="1352" height="30" fill="#ffffff"/><path d="M520 284 V314" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="304" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">providers/</text><text x="534" y="304" font-size="13" fill="#3b4a5a">ThemeProvider, LanguageProvider, ErrorNoticeHost.</text><rect x="24" y="314" width="1352" height="30" fill="#e8f0f8"/><path d="M520 314 V344" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="334" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">home/</text><text x="534" y="334" font-size="13" fill="#3b4a5a">AppTitle, LoadingBar, SwayingCompass, MascotButton.</text><rect x="24" y="344" width="1352" height="30" fill="#ffffff"/><path d="M520 344 V374" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="364" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">geo/</text><text x="534" y="364" font-size="13" fill="#3b4a5a">Compass (cadran), Globe3D (three.js), EarthSection.</text><rect x="24" y="374" width="1352" height="30" fill="#e8f0f8"/><path d="M520 374 V404" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="394" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">game/</text><text x="534" y="394" font-size="13" fill="#3b4a5a">GameHeader / GameFooter, FooterNav, PlaceCard, RoundResult, RoundsRecap, FinalStandings, Reaction*.</text><rect x="24" y="404" width="1352" height="30" fill="#ffffff"/><path d="M520 404 V434" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="424" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">setup/</text><text x="534" y="424" font-size="13" fill="#3b4a5a">Préparation de partie : sections de réglages + hook useSetupRoom.</text><rect x="24" y="434" width="1352" height="30" fill="#e8f0f8"/><path d="M520 434 V464" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="454" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">hooks/</text><text x="534" y="454" font-size="13" fill="#3b4a5a">Hooks React partagés : room.ts (session, présence, réactions, purge), app.ts (debounce, chargement).</text><rect x="24" y="464" width="1352" height="30" fill="#ffffff"/><path d="M520 464 V494" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="484" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">helpers/</text><text x="534" y="484" font-size="13" fill="#3b4a5a">Fonctions simples sans Firebase : geo, scoring, rounds, utils, platform, storage, errors.</text><rect x="24" y="494" width="1352" height="30" fill="#e8f0f8"/><path d="M520 494 V524" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="514" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">firebase/</text><text x="534" y="514" font-size="13" fill="#3b4a5a">Tout ce qui touche Firebase : client, room, places, tirage, constants, types, read, numbering, journal.</text><rect x="24" y="524" width="1352" height="30" fill="#ffffff"/><path d="M520 524 V554" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="544" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">store/</text><text x="534" y="544" font-size="13" fill="#3b4a5a">Un seul store Zustand : roomStore.ts (useRoomStore) + types.</text><rect x="24" y="554" width="1352" height="30" fill="#e8f0f8"/><path d="M520 554 V584" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="574" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">data/</text><text x="534" y="574" font-size="13" fill="#3b4a5a">Constantes partagées : index.ts, game.ts (catégories, défauts, score), theme.ts.</text><rect x="24" y="584" width="1352" height="30" fill="#ffffff"/><path d="M520 584 V614" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="604" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">settings/ · themes/ · i18n/ · types/</text><text x="534" y="604" font-size="13" fill="#3b4a5a">Réglages et nom du joueur · thèmes night / day · français / anglais · types de domaine.</text><rect x="24" y="104" width="1352" height="510" fill="none" stroke="#9db3c8" stroke-width="1"/><rect x="24" y="636" width="1352" height="34" rx="6" fill="#7a4a1d"/><text x="38" y="658" font-size="15" font-weight="700" fill="#ffffff">admin/ : l’outil interne (Vite + React, Vitest, Storybook)</text><text x="534" y="658" font-size="12.5" fill="#ffffff" opacity="0.85">rôle</text><rect x="24" y="670" width="1352" height="30" fill="#ffffff"/><path d="M520 670 V700" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="690" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">src/</text><text x="534" y="690" font-size="13" fill="#3b4a5a">App, views/ (Lieux, Monde, Erreurs), api/, data.ts (copie locale + journal), firebase.ts.</text><rect x="24" y="700" width="1352" height="30" fill="#e8f0f8"/><path d="M520 700 V730" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="720" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">.storybook/</text><text x="534" y="720" font-size="13" fill="#3b4a5a">Config Storybook : main, manager (thème clair / sombre), preview, utils/ (alias ~sb).</text><rect x="24" y="670" width="1352" height="60" fill="none" stroke="#9db3c8" stroke-width="1"/><rect x="24" y="752" width="1352" height="34" rx="6" fill="#2f6b2f"/><text x="38" y="774" font-size="15" font-weight="700" fill="#ffffff">Racine du dépôt</text><text x="534" y="774" font-size="12.5" fill="#ffffff" opacity="0.85">rôle</text><rect x="24" y="786" width="1352" height="30" fill="#ffffff"/><path d="M520 786 V816" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="806" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">docs/</text><text x="534" y="806" font-size="13" fill="#3b4a5a">Schémas : architecture.svg, structure.svg, firestore-flows.svg.</text><rect x="24" y="816" width="1352" height="30" fill="#e8f0f8"/><path d="M520 816 V846" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="836" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">scripts/</text><text x="534" y="836" font-size="13" fill="#3b4a5a">globe-land.mjs (décor du globe), admin.mjs, storybook.mjs.</text><rect x="24" y="846" width="1352" height="30" fill="#ffffff"/><path d="M520 846 V876" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="866" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">.claude/</text><text x="534" y="866" font-size="13" fill="#3b4a5a">Skills du projet (push, quality-check, firestore-data) et agent unit-test-upgrader.</text><rect x="24" y="876" width="1352" height="30" fill="#e8f0f8"/><path d="M520 876 V906" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="896" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">.github/workflows/</text><text x="534" y="896" font-size="13" fill="#3b4a5a">deploy-pages.yml : jeu web + admin + Storybook sur GitHub Pages.</text><rect x="24" y="906" width="1352" height="30" fill="#ffffff"/><path d="M520 906 V936" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="926" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">firestore.rules · firestore.indexes.json</text><text x="534" y="926" font-size="13" fill="#3b4a5a">Règles et index Firestore (déployés à part, pas par le push).</text><rect x="24" y="936" width="1352" height="30" fill="#e8f0f8"/><path d="M520 936 V966" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="956" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">app.json · package.json</text><text x="534" y="956" font-size="13" fill="#3b4a5a">Config Expo (version + animal), dépendances, config Jest.</text><rect x="24" y="966" width="1352" height="30" fill="#ffffff"/><path d="M520 966 V996" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="986" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">CLAUDE.md</text><text x="534" y="986" font-size="13" fill="#3b4a5a">Règles du dépôt ; un CLAUDE.md par dossier principal (components, screens, helpers, hooks, firebase, store, admin).</text><rect x="24" y="786" width="1352" height="210" fill="none" stroke="#9db3c8" stroke-width="1"/><rect x="24" y="1018" width="1352" height="34" rx="6" fill="#5a3d8a"/><text x="38" y="1040" font-size="15" font-weight="700" fill="#ffffff">Dans un composant ou un écran</text><text x="534" y="1040" font-size="12.5" fill="#ffffff" opacity="0.85">rôle</text><rect x="24" y="1052" width="1352" height="30" fill="#ffffff"/><path d="M520 1052 V1082" stroke="#c9d6e3" stroke-width="1"/><text x="38" y="1072" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">&lt;Name&gt;/</text><text x="534" y="1072" font-size="13" fill="#3b4a5a">Un composant = un dossier auto-contenu.</text><rect x="24" y="1082" width="1352" height="30" fill="#e8f0f8"/><path d="M520 1082 V1112" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="1102" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">index.ts</text><text x="534" y="1102" font-size="13" fill="#3b4a5a">Ré-exporte le composant en default.</text><rect x="24" y="1112" width="1352" height="30" fill="#ffffff"/><path d="M520 1112 V1142" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="1132" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">&lt;Name&gt;.tsx</text><text x="534" y="1132" font-size="13" fill="#3b4a5a">Export nommé : le rendu.</text><rect x="24" y="1142" width="1352" height="30" fill="#e8f0f8"/><path d="M520 1142 V1172" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="1162" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">helpers.ts · constants.ts · types.ts</text><text x="534" y="1162" font-size="13" fill="#3b4a5a">Logique pure, valeurs, types.</text><rect x="24" y="1172" width="1352" height="30" fill="#ffffff"/><path d="M520 1172 V1202" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="1192" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#1f2a37">styles.ts</text><text x="534" y="1192" font-size="13" fill="#3b4a5a">createStyles(theme), aucune logique.</text><rect x="24" y="1202" width="1352" height="30" fill="#e8f0f8"/><path d="M520 1202 V1232" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="1222" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">__tests__/</text><text x="534" y="1222" font-size="13" fill="#3b4a5a">Les tests (Jest, 100 % de couverture).</text><rect x="24" y="1232" width="1352" height="30" fill="#ffffff"/><path d="M520 1232 V1262" stroke="#c9d6e3" stroke-width="1"/><text x="64" y="1252" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">doc/</text><text x="534" y="1252" font-size="13" fill="#3b4a5a">&lt;Name&gt;.stories.tsx + &lt;Story&gt;.source.md (Storybook).</text><rect x="24" y="1052" width="1352" height="210" fill="none" stroke="#9db3c8" stroke-width="1"/>
</svg>
