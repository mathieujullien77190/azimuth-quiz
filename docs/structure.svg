<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Structure des fichiers d'Azimuth Quiz</title>
  <rect width="1500" height="1000" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#1f2a37">Structure des fichiers</text>
  <text x="640" y="36" font-size="12.5" fill="#5b6b7c">à quoi sert chaque dossier</text>
  <rect x="14" y="776" width="1472" height="210" rx="12" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.2" opacity="0.7"/>
<text x="30" y="64" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">azimuth-quiz/</text><text x="640" y="64" font-size="12.5" fill="#5b6b7c">racine du depot</text><path d="M38 72 V83 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="88" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">src/</text><text x="640" y="88" font-size="12.5" fill="#5b6b7c">l'appli Expo (web, iOS, Android)</text><path d="M64 96 V107 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="112" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">app/</text><text x="640" y="112" font-size="12.5" fill="#5b6b7c">routes Expo Router : _layout (providers + Stack), index, setup, online-game, settings (re-exports minces)</text><path d="M64 120 V131 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="136" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">screens/</text><text x="640" y="136" font-size="12.5" fill="#5b6b7c">un dossier par ecran : container (hooks, routeur, stores) + vue dumb + styles + doc/</text><path d="M90 144 V155 H104" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="108" y="160" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">HomeScreen/ SettingsScreen/ RoomDeletedScreen/ EndScreen/</text><text x="640" y="160" font-size="12.5" fill="#5b6b7c">container + HomeScreenView ; etat local, sans hook colocalise</text><path d="M90 168 V179 H104" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="108" y="184" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">SetupScreen/ OnlineGameScreen/</text><text x="640" y="184" font-size="12.5" fill="#5b6b7c">container + vue + hook colocalise (useOnlineRoom, useOnlineGame)</text><path d="M64 192 V203 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="208" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">components/</text><text x="640" y="208" font-size="12.5" fill="#5b6b7c">composants reutilisables, ranges par role</text><path d="M90 216 V227 H104" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="108" y="232" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">ui/</text><text x="640" y="232" font-size="12.5" fill="#5b6b7c">primitives : Button, Card, Chip, Screen, Section, SliderTrack, Toggle...</text><path d="M90 240 V251 H104" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="108" y="256" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">providers/</text><text x="640" y="256" font-size="12.5" fill="#5b6b7c">ThemeProvider, LanguageProvider, ErrorNoticeHost</text><path d="M90 264 V275 H104" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="108" y="280" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">home/</text><text x="640" y="280" font-size="12.5" fill="#5b6b7c">AppTitle, LoadingBar, SwayingCompass, MascotButton</text><path d="M90 288 V299 H104" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="108" y="304" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">geo/</text><text x="640" y="304" font-size="12.5" fill="#5b6b7c">Compass (cadran), Globe3D (three.js), EarthSection</text><path d="M90 312 V323 H104" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="108" y="328" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">game/</text><text x="640" y="328" font-size="12.5" fill="#5b6b7c">GameHeader/Footer, FooterNav, PlaceCard, RoundResult, RoundsRecap, FinalStandings, Reaction*</text><path d="M90 336 V347 H104" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="108" y="352" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">setup/</text><text x="640" y="352" font-size="12.5" fill="#5b6b7c">preparation : sections de reglages + hook useSetupRoom</text><path d="M64 360 V371 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="376" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">hooks/</text><text x="640" y="376" font-size="12.5" fill="#5b6b7c">hooks React partages : room.ts (session, presence, reactions, purge), app.ts (debounce, chargement)</text><path d="M64 384 V395 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="400" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">helpers/</text><text x="640" y="400" font-size="12.5" fill="#5b6b7c">fonctions simples sans Firebase : geo, scoring, rounds, utils, platform, storage, errors...</text><path d="M64 408 V419 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="424" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">firebase/</text><text x="640" y="424" font-size="12.5" fill="#5b6b7c">TOUT ce qui touche Firebase : client, room, places, tirage, types, constants, read, numbering, journal</text><path d="M64 432 V443 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="448" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">store/</text><text x="640" y="448" font-size="12.5" fill="#5b6b7c">un seul store Zustand : roomStore.ts (useRoomStore) + types</text><path d="M64 456 V467 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="472" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">data/</text><text x="640" y="472" font-size="12.5" fill="#5b6b7c">constantes partagees (index.ts), game.ts (categories, defauts, score), theme.ts</text><path d="M64 480 V491 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="496" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">settings/ themes/ i18n/ types/</text><text x="640" y="496" font-size="12.5" fill="#5b6b7c">reglages et nom du joueur · night/day · fr/en · types de domaine</text><path d="M38 504 V515 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="520" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">admin/</text><text x="640" y="520" font-size="12.5" fill="#5b6b7c">outil interne : app Vite + React, Vitest, Storybook</text><path d="M64 528 V539 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="544" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">src/</text><text x="640" y="544" font-size="12.5" fill="#5b6b7c">App, views/ (Lieux, Monde, Erreurs), api/, data.ts (copie locale + journal), firebase.ts</text><path d="M64 552 V563 H78" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="82" y="568" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">.storybook/</text><text x="640" y="568" font-size="12.5" fill="#5b6b7c">config Storybook : main, manager (theme clair/sombre), preview, utils/ (alias ~sb)</text><path d="M38 576 V587 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="592" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">docs/</text><text x="640" y="592" font-size="12.5" fill="#5b6b7c">schemas : architecture.svg, structure.svg, firestore-flows.svg</text><path d="M38 600 V611 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="616" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">scripts/</text><text x="640" y="616" font-size="12.5" fill="#5b6b7c">globe-land.mjs (genere le decor du globe), admin.mjs, storybook.mjs</text><path d="M38 624 V635 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="640" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">.claude/</text><text x="640" y="640" font-size="12.5" fill="#5b6b7c">skills du projet (push, quality-check, firestore-data) et agent unit-test-upgrader</text><path d="M38 648 V659 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="664" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="700" fill="#1f2a37">.github/workflows/</text><text x="640" y="664" font-size="12.5" fill="#5b6b7c">deploy-pages.yml : jeu web + admin + Storybook sur GitHub Pages</text><path d="M38 672 V683 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="688" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">firestore.rules · firestore.indexes.json</text><text x="640" y="688" font-size="12.5" fill="#5b6b7c">regles et index Firestore (deployes a part, pas par le push)</text><path d="M38 696 V707 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="712" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">app.json · package.json</text><text x="640" y="712" font-size="12.5" fill="#5b6b7c">config Expo (version + animal), dependances et config Jest</text><path d="M38 720 V731 H52" stroke="#9db3c8" stroke-width="1.2" fill="none"/><text x="56" y="736" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-weight="400" fill="#5b6b7c">CLAUDE.md</text><text x="640" y="736" font-size="12.5" fill="#5b6b7c">regles du depot ; un CLAUDE.md par dossier principal (components, screens, helpers, hooks, firebase, store, admin)</text><text x="30" y="784" font-size="15" font-weight="700" fill="#1f2a37">Dans un composant ou un écran</text><text x="38" y="808" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2a37">&lt;Name&gt;/</text><text x="640" y="808" font-size="12.5" fill="#5b6b7c">un composant = un dossier</text><text x="38" y="832" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2a37">  index.ts</text><text x="640" y="832" font-size="12.5" fill="#5b6b7c">ré-exporte le composant en default</text><text x="38" y="856" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2a37">  &lt;Name&gt;.tsx</text><text x="640" y="856" font-size="12.5" fill="#5b6b7c">export nomme, le rendu</text><text x="38" y="880" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2a37">  helpers.ts · constants.ts · types.ts</text><text x="640" y="880" font-size="12.5" fill="#5b6b7c">logique pure, valeurs, types</text><text x="38" y="904" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2a37">  styles.ts</text><text x="640" y="904" font-size="12.5" fill="#5b6b7c">createStyles(theme), aucune logique</text><text x="38" y="928" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2a37">  __tests__/</text><text x="640" y="928" font-size="12.5" fill="#5b6b7c">les tests (Jest ; 100 % de couverture)</text><text x="38" y="952" font-size="13.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1f2a37">  doc/</text><text x="640" y="952" font-size="12.5" fill="#5b6b7c">&lt;Name&gt;.stories.tsx + &lt;Story&gt;.source.md (Storybook)</text>
</svg>
